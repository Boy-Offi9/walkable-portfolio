<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Walkable Portfolio</title>
    <meta name="description" content="A first-person 3D portfolio you walk through." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Walkable Portfolio" />
    <meta property="og:description" content="A first-person 3D portfolio you walk through." />
    <meta name="theme-color" content="#050b16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;700;800&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="intro" role="dialog" aria-modal="true" aria-labelledby="iname">
      <div class="in">
        <span id="imark"></span>
        <h1 id="iname"></h1>
        <p id="irole"></p>
        <div id="ibar"><i></i></div>
        <p id="istat" aria-live="polite">Building the room</p>
        <button id="ienter" type="button" disabled>Enter</button>
        <button id="itour" type="button" disabled>Take the tour</button>
        <button id="ilist" type="button">Text version</button>
        <label id="isnd"><input id="isndc" type="checkbox" checked /> Sound on</label>
      </div>
    </div>
    <div id="labels"></div>
    <div id="list" role="dialog" aria-modal="true" aria-labelledby="lname" hidden></div>
    <div id="tour" hidden>
      <svg id="tsvg" aria-hidden="true">
        <defs>
          <mask id="tmask">
            <rect width="100%" height="100%" fill="#fff" />
            <rect id="thole" width="0" height="0" fill="#000" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(3,8,18,0.82)" mask="url(#tmask)" />
        <line id="tline" />
        <circle id="tdot" r="4" />
      </svg>
      <div id="tring" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <section id="tcard" class="glass" role="dialog" aria-live="polite" aria-labelledby="ttitle">
        <div class="tn"><b id="tnum">01</b><span id="tof"></span></div>
        <h3 id="ttitle"></h3>
        <p id="ttext"></p>
        <div id="tdots"></div>
        <div class="tbtns">
          <button id="tskip" type="button" class="pill">Skip</button>
          <button id="tback" type="button" class="pill">Back</button>
          <button id="tnext" type="button" class="btn">Next</button>
        </div>
      </section>
    </div>

    <button id="menu" type="button" class="glass" aria-expanded="false" aria-controls="panel">
      <span id="mark"></span><b>Menu</b>
    </button>
    <div id="scrim" hidden></div>

    <aside id="panel" class="glass" aria-label="Menu" inert>
      <header>
        <div id="brand">
          <span id="mark2"></span>
          <div><b id="name"></b><i id="sub"></i></div>
        </div>
        <button id="pclose" type="button" class="x" aria-label="Close menu">&times;</button>
      </header>
      <div class="scroll">
        <div id="search">
          <input id="q" type="search" autocomplete="off" aria-label="Search" />
          <ul id="results" hidden></ul>
        </div>

        <h4>Go to</h4>
        <nav id="pills" aria-label="Stations"></nav>
        <button id="ttour" type="button" class="pill">Guided tour</button>
        <button id="tlist" type="button" class="pill">Text version</button>

        <h4>Time of day</h4>
        <div id="time">
          <input id="tl" type="range" min="0" max="24" step="0.05" aria-label="Time of day" />
          <span id="clock">10:30</span>
          <button id="tplay" type="button" class="pill">Play</button>
          <button id="tmus" type="button" class="pill" aria-pressed="false" aria-label="Music">
            &#9834;
          </button>
        </div>

        <h4>Preferences</h4>
        <div id="switches" class="switches"></div>

        <h4>Explore</h4>
        <p id="stats" class="stats"></p>
        <div id="tiles" class="tiles"></div>
        <p id="topics" class="chips" hidden></p>
        <p id="status">Standing</p>
      </div>
    </aside>

    <div id="dock" class="glass" hidden></div>
    <section id="card" class="glass" hidden aria-live="polite"></section>
    <div id="toast" role="status"></div>
    <p id="hint">
      Touch: hold the left side to walk, drag the right side to look. Open the menu for the timeline, search
      and settings.
    </p>
    <div id="joy"><div id="knob"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
